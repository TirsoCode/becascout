<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<!--
  Fuente de logo.png (512×512), el logo cuadrado que declara el JSON-LD
  `Organization`. Google pide un raster cuadrado; el favicon es SVG y no sirve.

    google-chrome --headless=new --disable-gpu --no-sandbox \
      --hide-scrollbars --force-device-scale-factor=1 \
      --window-size=512,512 --screenshot=logo.png tools/logo.html
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 512px; height: 512px; overflow: hidden; }
  body { background: #12463A; display: grid; place-items: center; }
  svg { width: 288px; height: 288px; color: #FBF8F3; }
</style>
</head>
<body>
  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <!-- El mismo dibujo que el favicon, a tamaño grande: papel con un boli
         encima. La hoja en crema, el boli en tinta oscura y el anillo del
         cuerpo en un verde claro, sobre el verde de la marca. -->
    <path d="M6 3.4h8l4.6 4.6v12.6H6z" fill="#F7F4EC"/>
    <path d="M14 3.4v4.6h4.6z" fill="#D8D0BF"/>
    <path d="M8.4 10.4h4.4M8.4 13.2h3" stroke="#C2B9A6" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M18.9 4.6 12 14.2" stroke="#1A2A24" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M12 14.2 9.9 17.2" stroke="#1A2A24" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M16.6 7.7 14.6 10.3" stroke="#A9BFB4" stroke-width="2.2" stroke-linecap="round"/>
  </svg>
</body>
</html>
