<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<!--
  Fuente de los PNG del icono. El dibujo vive una sola vez, en favicon.svg:
  este HTML solo lo escala al tamaño de la ventana. El fondo verde rellena
  las esquinas redondeadas, así que los PNG salen a sangre (lo que pide iOS
  para apple-touch-icon) sin duplicar el SVG.

    google-chrome --headless=new --disable-gpu --no-sandbox \
      --hide-scrollbars --force-device-scale-factor=1 \
      --window-size=512,512 --screenshot=icono-512.png tools/icono.html
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  img { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
  <img src="../favicon.svg" alt="">
</body>
</html>
