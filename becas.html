<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscar becas — BecasScout</title>
<meta name="description" content="Busca becas en Europa y comprueba requisito a requisito cuáles cumples.">
<meta name="theme-color" content="#12463A">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%2312463A'/%3E%3Cpath d='M7 5.5h7l4 4v9H7z' fill='none' stroke='%23F7F4EC' stroke-width='1.6' stroke-linejoin='round'/%3E%3Cpath d='M14 5.5v4h4' fill='none' stroke='%23F7F4EC' stroke-width='1.6'/%3E%3Cpath d='M9 13.8l1.7 1.7 3.8-3.8' fill='none' stroke='%23F7F4EC' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

  <style>
    /* Los enlaces legales van en el pie de todas las páginas, con un punto más
       de peso para que se encuentren cuando se buscan. */
    .foot-links a[href$="privacidad.html"],
    .foot-links a[href$="cookies.html"] { font-weight: 600; color: var(--ink-2); }
  </style>
</head>
<body>

<header class="top">
  <div class="shell top-in">
    <a class="brand" href="index.html">
      <svg class="brand-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M6.5 3h7.5l4.5 4.5V21h-12z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        <path d="M14 3v4.5h4.5" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        <path d="M9 14.4l2.1 2.1 4.3-4.3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-name">Becas<b>Scout</b></span>
    </a>
    <nav class="top-nav">
      <a href="index.html#como">Cómo funciona</a>
      <a href="index.html#metodo">Método</a>
    </nav>
    <div class="top-act" id="sesion-zona"></div>
  </div>
</header>

<main>
  <section class="find-top">
    <div class="shell">
      <h1 style="font-family:var(--display);font-size:clamp(30px,4vw,42px);font-weight:400;letter-spacing:-.022em;line-height:1.05;margin-bottom:8px">
        Convocatorias abiertas
      </h1>
      <p style="font-size:15px;color:var(--ink-3);margin-bottom:22px">
        Rellena tu perfil y mira requisito a requisito cuáles cumples.
      </p>

      <div class="profile-bar">
        <div class="f">
          <label for="nota">Nota media</label>
          <!-- type="text" y no "number" a propósito: la coma decimal —que es
               como se escribe una nota en España— no es válida en un input
               numérico, y el navegador la descarta en silencio. Con
               inputmode="decimal" sale el teclado numérico igual. -->
          <input id="nota" type="text" inputmode="decimal" placeholder="7,5" maxlength="5">
        </div>
        <div class="f">
          <label for="edad">Edad</label>
          <input id="edad" type="number" min="15" max="80" placeholder="21" inputmode="numeric">
        </div>
        <div class="f">
          <label for="nivel">Nivel</label>
          <select id="nivel">
            <option value="">Cualquiera</option>
            <option>Grado</option>
            <option>Máster</option>
            <option>Doctorado</option>
          </select>
        </div>
        <div class="f">
          <label for="pais">Destino</label>
          <select id="pais">
            <option value="">Cualquiera</option>
            <option>Alemania</option><option>Francia</option>
            <option>Reino Unido</option><option>Países Bajos</option>
            <option>Italia</option><option>España</option>
            <option>Portugal</option><option>Polonia</option>
          </select>
        </div>
        <button class="btn btn-brand" id="buscar">Comprobar</button>
      </div>

      <div class="counts" id="counts"></div>
    </div>
  </section>

  <section class="shell">
    <div id="zona-lista">
      <div class="loading">Cargando convocatorias…</div>
    </div>
  </section>
</main>

<footer class="foot">
  <div class="shell foot-in">
    <small>BecasScout · Proyecto independiente. Cada convocatoria enlaza a su fuente oficial.</small>
        <div class="foot-links">
      <a href="becas.html">Buscar becas</a>
      <a href="privacidad.html">Privacidad</a>
      <a href="cookies.html">Cookies</a>
      <a href="https://www.boe.es/" target="_blank" rel="noopener">BOE</a>
    </div>
  </div>
</footer>

<script type="module" src="js/becas.js"></script>
</body>
</html>
