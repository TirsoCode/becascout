name: Ingesta

# Cuándo corre sin que nadie pulse nada. **Dos pasadas al día**, y se bajaron
# de cuatro el 17 de octubre de 2026.
#
# El BOE publica dos ediciones diarias —una por la mañana y otra por la tarde—
# y una pasada bien colocada ve las dos. Se puso una después de cada una: 10:30
# UTC recoge la de la mañana, y 22:30 UTC la de la tarde. Cuatro pasadas no
# daban nada que las dos no dieran, solo gastaban cuatro veces el ancho de banda
# contra un servicio público.
#
# OJO, y esto no es un detalle: GitHub retrasa los cron de los planes
# gratuitos. Hay avisos de 8 a 14 horas de retraso, e incluso días que no se
# ejecutan. Está documentado en la conversación #156282 y #201738. Por eso
# el resultado se COMMITE dentro del repo y no se manda a ningún sitio: si
# una pasada se retrasa o se cae, la web sigue sirviendo el último
# becas.json bueno que haya, en vez de quedarse con datos viejos o vacíos.
on:
  schedule:
    - cron: '31 10 * * *'
    - cron: '37 22 * * *'
  # El botón manual es lo que de verdad se usa cuando se está depurando, y
  # la única forma de recuperar una pasada que el cron se comió.
  workflow_dispatch:
    inputs:
      dias:
        description: 'Días hacia atrás a revisar'
        required: false
        default: '21'
      concurrencia:
        description: 'Fichas procesadas a la vez (subirlo mucho hace que BDNS conteste "Acceso Denegado" en silencio)'
        required: false
        default: '6'

# Una sola ingesta a la vez. Sin esto, si una pasada tarda más que el
# intervalo, la siguiente arranca encima y las dos escriben el mismo
# fichero. Es el fallo más fácil de cometer y el más difícil de ver.
concurrency:
  group: ingesta
  cancel-in-progress: false

permissions:
  contents: write   # solo para poder commitear el resultado

jobs:
  ingesta:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          # El historial entero, y no solo el último commit. El `Commit` de
          # abajo rebasa sobre `origin/main` antes de subir, y con un clon
          # superficial —que es lo que trae `fetch-depth: 1`— no hay historial
          # con el que rebasar: el rebase fallaría y el push se rechazaría.
          # Esto ya pasó: el 18 de octubre de 2026 el push se quedó en
          # «! [rejected] main -> main (fetch first)» y la pasada se perdió.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # Node 20 está fuera de soporte desde abril de 2026 y el propio
          # runner avisa de ello. Vercel ya va por 24 y en local es 24.
          node-version: '24'
          cache: 'npm'

      # ── El punto bueno de GitHub Actions ──────────────────────────────
      # El runner de ubuntu-latest YA TRAE Google Chrome instalado y
      # actualizado. No hace falta `npx playwright install`, que tarda
      # varios minutos y además se descarga un Chromium aparte que no es
      # el del sistema. Para lo que necesitamos —saltarse WAFs con un
      # navegador de verdad— el Chrome preinstalado sirve y es más rápido.
      - name: Comprobar Chrome
        run: |
          google-chrome --version
          echo "HOME=$HOME"

      - name: Ingesta
        run: |
          # `pipefail` no es un detalle. Sin él, el código de salida de este
          # paso es el de `tee`, que siempre es cero: una ingesta que revienta
          # —un `TypeError` en el extractor, un Chrome que no arranca— salía
          # en verde, y el paso de Commit subía el `becas.json` de antes como
          # si fuera el de ahora. Con `pipefail`, una ingesta caída para el
          # paso y el fichero viejo se queda donde está.
          set -o pipefail

          # `--dias 21` mira hacia atrás tres semanas: la ventana que
          # cubre desde la última pasada con margen para una que se haya
          # retrasado, que es el fallo conocido de este sistema.
          #
          # `--concurrencia` son las fichas que se procesan a la vez. Seis es
          # lo que cabe de sobra en el `timeout-minutes` de este job; subirlo
          # mucho tiene un precio que no se ve, porque BDNS contesta
          # «Acceso Denegado» sin error y la ficha se queda sin presupuesto sin
          # que nada falle. Ver la nota larga en ingest/run.mjs.
          node ingest/run.mjs --dias "${{ inputs.dias || 21 }}" \
            --concurrencia "${{ inputs.concurrencia || 6 }}" \
            2>&1 | tee ingesta.log

      - name: Paginas (feed, Erasmus Mundus, llms-full)
        # Continuar si la verificación de hechos con la Comisión falla — es una
        # red externa y el job de la ingesta no puede depender de ella: las
        # páginas quedan como estaban (mismo trato que una fuente caída).
        continue-on-error: true
        run: |
          # Mismo `pipefail` que el paso de Ingesta, y por el mismo motivo: sin
          # él, el código de salida de este paso es el de `tee`, que siempre es
          # cero. Un `paginas.mjs` revientado —o una consulta a la Comisión que
          # se quede a mitad— saldría en verde y el commit llevaría páginas
          # viejas o a medio escribir.
          set -o pipefail

          node ingest/paginas.mjs 2>&1 | tee paginas.log

      - name: Resumen
        if: always()
        run: |
          echo "### Convocatorias en la base" >> $GITHUB_STEP_SUMMARY
          if [ -f data/becas.json ]; then
            # Qué tenía el fichero antes de esta pasada. Sin esta línea, una
            # base que se queda en la cuarta parte se ve como un número más y
            # no hay forma de saber que se ha perdido la base entera.
            git show HEAD:data/becas.json > /tmp/antes.json 2>/dev/null \
              || echo '{"becas":[]}' > /tmp/antes.json
            node -e "
              const d = require('./data/becas.json');
              const b = d.becas;
              const req = b.filter(x => (x.requisitos || []).length).length;
              const citas = b.reduce((n, x) => n + (x.requisitos || []).length, 0);
              const antes = require('/tmp/antes.json').becas.length;
              console.log('| Métrica | Valor |');
              console.log('| --- | --- |');
              console.log('| Convocatorias | ' + b.length + ' |');
              console.log('| Antes de esta pasada | ' + antes + ' |');
              console.log('| Con requisitos | ' + req + ' |');
              console.log('| Requisitos con cita | ' + citas + ' |');
              console.log('| Rango | ' + d.rango.desde + ' → ' + d.rango.hasta + ' |');
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "No se generó data/becas.json — la ingesta falló." >> $GITHUB_STEP_SUMMARY
          fi

      # El log completo, porque cuando algo va mal el motivo suele estar
      # dos líneas más abajo del error que se ve en la web.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-ingesta
          path: |
            ingesta.log
            paginas.log
          retention-days: 14

      - name: Commit
        run: |
          # El correo del commit tiene que estar en una cuenta de GitHub, no
          # valer cualquiera. Vercel bloquea el despliegue —«the commit email
          # could not be matched to a GitHub account»— cuando no puede
          # emparejar al autor: pasó con `tirsolemda@gmail.com` el 18 de octubre
          # de 2026. Se usa el `noreply` de la cuenta dueña del repo; si el repo
          # cambia de dueño, cambia también aquí.
          git config user.name  'BecasScout'
          git config user.email '284927969+TirsoCode@users.noreply.github.com'

          # Cuatro ficheros: la base y las tres páginas que `paginas.mjs`
          # regenera a partir de ella. Van en la misma línea a mano y no
          # `git add .` porque en esta carpeta también vive el almacén de
          # respaldo con correos y sesiones, y aunque `.gitignore` lo tapa,
          # `.gitignore` no es lo que decide qué se sube. Ese fichero es
          # `.vercelignore`.
          git add data/becas.json erasmus-mundus.html feed.xml llms-full.txt

          # Un fichero sin fichas no es un resultado: es un fallo con forma de
          # fichero. No se publica, y el paso falla para que se vea.
          fichas=$(node -e "console.log(require('./data/becas.json').becas.length)")
          if [ "$fichas" -lt 1 ]; then
            echo "data/becas.json no tiene ninguna ficha. No se publica nada."
            exit 1
          fi

          if git diff --staged --quiet; then
            echo "Sin cambios: la base ya estaba al día."
            exit 0
          fi

          # El formato de `date` va entre comillas. Sin ellas, `%Y-%m-%d` y
          # `%H:%M` llegan como dos operandos y `date` contesta «extra operand
          # '%H:%M'»: el mensaje se quedaba sin fecha («data: 2 ⋅  UTC») y
          # dos commits distintos parecían el mismo.
          git commit -m "data: ${GITHUB_RUN_NUMBER} ⋅ $(date -u '+%Y-%m-%d %H:%M') UTC"

          # ── Por qué hay un rebase aquí ──────────────────────────────────
          #
          # El runner hace el checkout de un commit concreto. Si `main` ha
          # avanzado desde entonces —porque alguien ha subido algo, o porque
          # ha corrido otra pasada— el push se rechaza entero:
          #
          #   ! [rejected]        main -> main (fetch first)
          #   error: failed to push some refs to '…'
          #
          # Pasó el 18 de octubre de 2026 y la pasada se perdió: la base se
          # quedó con lo que hubiera, sin la ventana nueva, y el paso salió
          # en rojo sin que nadie entendiera por qué. Rebasar antes de
          # subir deja el commit de datos encima de lo que haya ahora, y como
          # solo toca ficheros generados —la base y las tres páginas—, el
          # conflicto, si lo hay, se resuelve sin perder nada de nadie.
          git fetch origin main
          git rebase origin/main || {
            # Los dos lados tocamos ficheros generados. Gana esta pasada, que
            # es la que acaba de leer el BOE y la que cumple el invariante de
            # `ingest/run.mjs`; las páginas se regeneran a partir de ella, así
            # que la recuperación basta con volver a añadirlas.
            git checkout --theirs -- data/becas.json || true
            git add data/becas.json erasmus-mundus.html feed.xml llms-full.txt 2>/dev/null || true
            GIT_EDITOR=true git rebase --continue || true
          }

          # Y si alguien empuja entre el `fetch` y el `push`, se reintenta:
          # son tres intentos y sale. Un rebase por intento, porque el remoto
          # puede haber avanzado otra vez.
          for intento in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "El push se ha rechazado (intento $intento). Se reintenta."
            git fetch origin main
            git rebase origin/main || {
              git checkout --theirs -- data/becas.json || true
              git add data/becas.json
              GIT_EDITOR=true git rebase --continue || true
            }
          done
          echo "No se ha podido subir la base tras tres intentos."
          exit 1
